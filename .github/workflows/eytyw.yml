name: BuildAndTest

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  pipeline:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.13"]
      fail-fast: false
      max-parallel: 1
    env:
      PY_COLORS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Locale setup
        run: |
          sudo apt-get update
          sudo apt-get install -y tzdata locales
          sudo locale-gen en_US.UTF-8
          sudo localectl set-locale LANG=en_US.UTF-8
          export LANG=en_US.UTF-8
          sudo update-locale
          locale -a && locale && localectl status

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install --upgrade seleniumbase pyautogui pymongo python-xlib

      - name: Install Chrome (conditional)
        if: matrix.os == 'ubuntu-20.04'
        run: sudo apt-get install -y google-chrome-stable

      - name: Verify CLI entrypoints
        run: |
          seleniumbase
          sbase

      - name: Setup chromedriver
        run: seleniumbase install chromedriver

      - name: Cloudflare WARP client
        run: |
          sudo apt-get update && sudo apt-get install -y curl
          curl https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos connect
          sleep 5
          sudo warp-cli --accept-tos status

      - name: Execute leka.py
        run: python leka.py --debug --chrome --xvfb --screenshot

      - name: Archive screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ./latest_logs/
